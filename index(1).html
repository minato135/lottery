<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b10" />
  <title>1/99.9 完全確率くじ</title>
  <style>
    :root {
      --bg: #0b0b10;
      --card: #15151d;
      --card2: #1d1d27;
      --text: #f7f7fb;
      --sub: #a9a9b7;
      --accent: #d7ff3f;
      --danger: #ff5f73;
      --line: rgba(255,255,255,.09);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(24px, env(safe-area-inset-bottom));
      overflow-x: hidden;
    }

    .app {
      width: min(100%, 460px);
    }

    .eyebrow {
      text-align: center;
      color: var(--sub);
      font-size: 13px;
      letter-spacing: .16em;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(30px, 9vw, 44px);
      line-height: 1;
      letter-spacing: -.04em;
    }

    .prob {
      text-align: center;
      margin: 14px 0 24px;
      color: var(--accent);
      font-weight: 800;
      font-size: 18px;
    }

    .card {
      background: linear-gradient(180deg, var(--card2), var(--card));
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0,0,0,.38);
    }

    .result {
      min-height: 128px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
    }

    .icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .message {
      font-size: 25px;
      font-weight: 800;
      margin: 0;
    }

    .detail {
      color: var(--sub);
      font-size: 14px;
      margin: 8px 0 0;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 8px;
    }

    .count-input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 17px 16px;
      background: rgba(255,255,255,.04);
      color: var(--text);
      font-size: 18px;
      font-weight: 700;
      outline: none;
    }

    .count-input:focus {
      border-color: rgba(215,255,63,.7);
      box-shadow: 0 0 0 3px rgba(215,255,63,.08);
    }

    .draw-button {
      border: 0;
      border-radius: 18px;
      padding: 17px 20px;
      background: var(--accent);
      color: #101108;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(215,255,63,.18);
      transition: transform .12s ease, opacity .12s ease;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
    }

    .draw-button:active { transform: scale(.98); }
    .draw-button:disabled { opacity: .6; cursor: default; }

    .quick-buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .quick-button {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 4px;
      background: rgba(255,255,255,.03);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .batch-summary {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 16px;
    }

    .batch-summary.show {
      display: grid;
    }

    .mini-stat {
      background: rgba(255,255,255,.03);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
    }

    .mini-label {
      color: var(--sub);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .mini-value {
      font-size: 18px;
      font-weight: 800;
    }

    .results-panel {
      display: none;
      margin-top: 16px;
      border-top: 1px solid var(--line);
      padding-top: 16px;
    }

    .results-panel.show {
      display: block;
    }

    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .results-title {
      font-weight: 800;
      font-size: 15px;
    }

    .legend {
      color: var(--sub);
      font-size: 12px;
      white-space: nowrap;
    }

    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
      gap: 7px;
      max-height: 300px;
      overflow-y: auto;
      padding: 2px 2px 4px;
    }

    .result-cell {
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 10px;
      font-size: 20px;
      font-weight: 900;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
    }

    .result-cell.win-cell {
      color: var(--accent);
      background: rgba(215,255,63,.08);
      border-color: rgba(215,255,63,.28);
    }

    .result-cell.lose-cell {
      color: var(--danger);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 16px;
    }

    .stat {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.025);
      border-radius: 18px;
      padding: 14px;
    }

    .stat-label {
      color: var(--sub);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 20px;
      font-weight: 800;
    }

    .footer {
      display: flex;
      justify-content: center;
      margin-top: 16px;
    }

    .reset {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--sub);
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
      padding: 8px;
    }

    .win {
      animation: winPulse .8s ease;
    }

    .lose {
      animation: shake .28s ease;
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle at center, rgba(215,255,63,.45), transparent 55%);
    }

    .flash.show {
      animation: flash .8s ease;
    }

    @keyframes winPulse {
      0% { transform: scale(.8); opacity: 0; }
      60% { transform: scale(1.08); }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      30% { transform: translateX(-5px); }
      70% { transform: translateX(5px); }
    }

    @keyframes flash {
      0% { opacity: 0; }
      25% { opacity: 1; }
      100% { opacity: 0; }
    }

    .small-note {
      text-align: center;
      color: var(--sub);
      font-size: 12px;
      line-height: 1.5;
      margin-top: 14px;
    }

    @media (max-width: 380px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .draw-button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="flash" id="flash"></div>

  <main class="app">
    <div class="eyebrow">完全独立抽選</div>
    <h1>1 / 99.9</h1>
    <div class="prob">当選確率 約1.001%</div>

    <section class="card">
      <div class="result" id="result">
        <div>
          <div class="icon" id="icon">🎯</div>
          <p class="message" id="message">抽選回数を決めよう</p>
          <p class="detail" id="detail">1回〜10,000回までまとめて抽選できます</p>
        </div>
      </div>

      <div class="controls">
        <input
          class="count-input"
          id="drawCount"
          type="number"
          inputmode="numeric"
          min="1"
          max="10000"
          value="10"
          aria-label="抽選回数"
        />
        <button class="draw-button" id="drawButton">まとめて抽選</button>
      </div>

      <div class="quick-buttons">
        <button class="quick-button" data-count="1">1回</button>
        <button class="quick-button" data-count="10">10回</button>
        <button class="quick-button" data-count="100">100回</button>
        <button class="quick-button" data-count="1000">1000回</button>
      </div>

      <div class="batch-summary" id="batchSummary">
        <div class="mini-stat">
          <div class="mini-label">今回の抽選</div>
          <div class="mini-value" id="batchTotal">0</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">今回の当たり</div>
          <div class="mini-value" id="batchWins">0</div>
        </div>
        <div class="mini-stat">
          <div class="mini-label">今回のハズレ</div>
          <div class="mini-value" id="batchLosses">0</div>
        </div>
      </div>

      <div class="results-panel" id="resultsPanel">
        <div class="results-header">
          <div class="results-title">今回の結果一覧</div>
          <div class="legend">○＝当たり　×＝ハズレ</div>
        </div>
        <div class="results-grid" id="resultsGrid"></div>
      </div>

      <div class="stats">
        <div class="stat">
          <div class="stat-label">総抽選回数</div>
          <div class="stat-value" id="total">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">総当たり回数</div>
          <div class="stat-value" id="wins">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">現在の連続ハズレ</div>
          <div class="stat-value" id="streak">0</div>
        </div>
        <div class="stat">
          <div class="stat-label">最大連続ハズレ</div>
          <div class="stat-value" id="maxStreak">0</div>
        </div>
      </div>

      <div class="footer">
        <button class="reset" id="resetButton">記録をリセット</button>
      </div>
    </section>

    <p class="small-note">
      抽選はすべて独立です。何回外れても、次の1回の当選確率は常に1/99.9です。
    </p>
  </main>

  <script>
    const WIN_PROBABILITY = 1 / 99.9;
    const MAX_BATCH = 10000;

    const saved = JSON.parse(localStorage.getItem("lotteryStats") || "{}");
    let stats = {
      total: Number(saved.total) || 0,
      wins: Number(saved.wins) || 0,
      streak: Number(saved.streak) || 0,
      maxStreak: Number(saved.maxStreak) || 0
    };

    const totalEl = document.getElementById("total");
    const winsEl = document.getElementById("wins");
    const streakEl = document.getElementById("streak");
    const maxStreakEl = document.getElementById("maxStreak");

    const resultEl = document.getElementById("result");
    const iconEl = document.getElementById("icon");
    const messageEl = document.getElementById("message");
    const detailEl = document.getElementById("detail");
    const drawCountEl = document.getElementById("drawCount");
    const drawButton = document.getElementById("drawButton");
    const resetButton = document.getElementById("resetButton");
    const flash = document.getElementById("flash");

    const batchSummary = document.getElementById("batchSummary");
    const batchTotalEl = document.getElementById("batchTotal");
    const batchWinsEl = document.getElementById("batchWins");
    const batchLossesEl = document.getElementById("batchLosses");
    const resultsPanel = document.getElementById("resultsPanel");
    const resultsGrid = document.getElementById("resultsGrid");

    function save() {
      localStorage.setItem("lotteryStats", JSON.stringify(stats));
    }

    function renderStats() {
      totalEl.textContent = stats.total.toLocaleString("ja-JP");
      winsEl.textContent = stats.wins.toLocaleString("ja-JP");
      streakEl.textContent = stats.streak.toLocaleString("ja-JP");
      maxStreakEl.textContent = stats.maxStreak.toLocaleString("ja-JP");
    }

    function setMainResult(batchCount, batchWins) {
      resultEl.classList.remove("win", "lose");
      void resultEl.offsetWidth;

      if (batchWins > 0) {
        resultEl.classList.add("win");
        flash.classList.remove("show");
        void flash.offsetWidth;
        flash.classList.add("show");

        iconEl.textContent = "🎉";
        messageEl.textContent = `${batchWins}回当たり！`;
        detailEl.textContent =
          `${batchCount.toLocaleString("ja-JP")}回中、${batchWins.toLocaleString("ja-JP")}回当選`;

        if (navigator.vibrate) navigator.vibrate([80, 60, 120]);
      } else {
        resultEl.classList.add("lose");
        iconEl.textContent = "×";
        messageEl.textContent = "今回は当たりなし";
        detailEl.textContent =
          `${batchCount.toLocaleString("ja-JP")}回すべてハズレ`;

        if (navigator.vibrate) navigator.vibrate(35);
      }
    }

    function renderBatchResults(results) {
      const fragment = document.createDocumentFragment();

      for (const isWin of results) {
        const cell = document.createElement("div");
        cell.className = `result-cell ${isWin ? "win-cell" : "lose-cell"}`;
        cell.textContent = isWin ? "○" : "×";
        fragment.appendChild(cell);
      }

      resultsGrid.replaceChildren(fragment);
      resultsPanel.classList.add("show");
    }

    function normalizeCount() {
      let count = Number.parseInt(drawCountEl.value, 10);

      if (!Number.isFinite(count)) count = 1;
      count = Math.max(1, Math.min(MAX_BATCH, count));

      drawCountEl.value = count;
      return count;
    }

    function drawLotteryBatch() {
      const count = normalizeCount();

      drawButton.disabled = true;
      drawButton.textContent = "抽選中…";
      iconEl.textContent = "···";
      messageEl.textContent = `${count.toLocaleString("ja-JP")}回抽選中`;
      detailEl.textContent = "";

      setTimeout(() => {
        const results = [];
        let batchWins = 0;

        for (let i = 0; i < count; i++) {
          const isWin = Math.random() < WIN_PROBABILITY;
          results.push(isWin);

          stats.total += 1;

          if (isWin) {
            batchWins += 1;
            stats.wins += 1;
            stats.streak = 0;
          } else {
            stats.streak += 1;
            stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
          }
        }

        const batchLosses = count - batchWins;

        batchTotalEl.textContent = count.toLocaleString("ja-JP");
        batchWinsEl.textContent = batchWins.toLocaleString("ja-JP");
        batchLossesEl.textContent = batchLosses.toLocaleString("ja-JP");

        batchSummary.classList.add("show");
        renderBatchResults(results);
        setMainResult(count, batchWins);
        renderStats();
        save();

        drawButton.disabled = false;
        drawButton.textContent = "もう一度抽選";
      }, 450);
    }

    function resetStats() {
      const ok = confirm("抽選記録をすべてリセットしますか？");
      if (!ok) return;

      stats = { total: 0, wins: 0, streak: 0, maxStreak: 0 };
      save();
      renderStats();

      resultEl.classList.remove("win", "lose");
      iconEl.textContent = "🎯";
      messageEl.textContent = "抽選回数を決めよう";
      detailEl.textContent = "1回〜10,000回までまとめて抽選できます";

      batchSummary.classList.remove("show");
      resultsPanel.classList.remove("show");
      resultsGrid.replaceChildren();
      drawButton.textContent = "まとめて抽選";
    }

    drawButton.addEventListener("click", drawLotteryBatch);
    resetButton.addEventListener("click", resetStats);

    drawCountEl.addEventListener("keydown", event => {
      if (event.key === "Enter") drawLotteryBatch();
    });

    document.querySelectorAll(".quick-button").forEach(button => {
      button.addEventListener("click", () => {
        drawCountEl.value = button.dataset.count;
      });
    });

    renderStats();
  </script>
</body>
</html>
