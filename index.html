<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b10"><title>完全確率くじ</title>
<style>
:root{--bg:#0b0b10;--card:#171720;--text:#f7f7fb;--sub:#aaaaba;--accent:#d7ff3f;--danger:#ff5f73;--line:rgba(255,255,255,.09)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{display:grid;place-items:center;padding:max(20px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}.app{width:min(100%,460px)}.eyebrow{text-align:center;color:var(--sub);font-size:13px;letter-spacing:.16em;margin-bottom:10px}h1{margin:0;text-align:center;font-size:clamp(30px,9vw,44px);line-height:1}.prob{text-align:center;margin:14px 0 24px;color:var(--accent);font-weight:800;font-size:18px}.card{background:linear-gradient(180deg,#1e1e29,var(--card));border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:0 24px 70px rgba(0,0,0,.38)}.result{min-height:120px;display:grid;place-items:center;text-align:center;padding:8px}.icon{font-size:46px;margin-bottom:10px}.message{font-size:24px;font-weight:800;margin:0}.detail{color:var(--sub);font-size:14px;margin:8px 0 0}.settings{display:grid;gap:12px}.box{border:1px solid var(--line);background:rgba(255,255,255,.025);border-radius:18px;padding:14px}.label{display:block;color:var(--sub);font-size:12px;margin-bottom:8px}.fraction{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}.prefix{font-size:22px;font-weight:900;color:var(--accent)}.input{width:100%;border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.04);color:var(--text);font-size:18px;font-weight:700;outline:none}.input:focus{border-color:rgba(215,255,63,.7);box-shadow:0 0 0 3px rgba(215,255,63,.08)}.help{color:var(--sub);font-size:11px;margin-top:7px;line-height:1.5}.draw{width:100%;border:0;border-radius:18px;padding:17px 20px;background:var(--accent);color:#101108;font-size:18px;font-weight:900;cursor:pointer}.draw:disabled{opacity:.6}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}.quick button{border:1px solid var(--line);border-radius:14px;padding:10px 4px;background:rgba(255,255,255,.03);color:var(--text);font-weight:700}.summary{display:none;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}.summary.show{display:grid}.mini,.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}.mini small,.stat small{display:block;color:var(--sub);font-size:11px;margin-bottom:5px}.mini strong,.stat strong{font-size:18px}.panel{display:none;margin-top:16px;border-top:1px solid var(--line);padding-top:16px}.panel.show{display:block}.panel-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px}.legend{color:var(--sub);font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:7px;max-height:300px;overflow-y:auto}.cell{aspect-ratio:1;display:grid;place-items:center;border-radius:10px;font-size:20px;font-weight:900;border:1px solid var(--line);color:var(--danger)}.cell.win{color:var(--accent);background:rgba(215,255,63,.08);border-color:rgba(215,255,63,.28)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.stat{text-align:left;padding:14px}.reset-wrap{text-align:center;margin-top:16px}.reset{border:0;background:none;color:var(--sub);text-decoration:underline}.note{text-align:center;color:var(--sub);font-size:12px;line-height:1.5;margin-top:14px}.flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(215,255,63,.45),transparent 55%)}.flash.show{animation:flash .8s}@keyframes flash{25%{opacity:1}100%{opacity:0}}@keyframes shake{30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}.shake{animation:shake .28s}.pulse{animation:pulse .7s}@keyframes pulse{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body><div class="flash" id="flash"></div><main class="app">
<div class="eyebrow">完全独立抽選</div><h1 id="title">1 / 99.9</h1><div class="prob" id="percent">当選確率 約1.001%</div>
<section class="card"><div class="result" id="result"><div><div class="icon" id="icon">🎯</div><p class="message" id="message">確率と抽選回数を決めよう</p><p class="detail" id="detail">設定した確率で毎回独立して抽選します</p></div></div>
<div class="settings"><div class="box"><label class="label" for="denominator">当選確率</label><div class="fraction"><span class="prefix">1 /</span><input class="input" id="denominator" type="number" inputmode="decimal" min="1" max="1000000000" step="0.1" value="99.9"></div><div class="help">例：99.9なら1/99.9、319.7なら1/319.7。1以上を入力。</div></div>
<div class="box"><label class="label" for="count">抽選回数</label><input class="input" id="count" type="number" inputmode="numeric" min="1" max="10000" value="10"><div class="help">1回〜10,000回までまとめて抽選できます。</div></div><button class="draw" id="draw">まとめて抽選</button></div>
<div class="quick"><button data-count="1">1回</button><button data-count="10">10回</button><button data-count="100">100回</button><button data-count="1000">1000回</button></div>
<div class="summary" id="summary"><div class="mini"><small>今回の抽選</small><strong id="batchTotal">0</strong></div><div class="mini"><small>今回の当たり</small><strong id="batchWins">0</strong></div><div class="mini"><small>今回のハズレ</small><strong id="batchLosses">0</strong></div></div>
<div class="panel" id="panel"><div class="panel-head"><strong>今回の結果一覧</strong><span class="legend">○＝当たり　×＝ハズレ</span></div><div class="grid" id="grid"></div></div>
<div class="stats"><div class="stat"><small>総抽選回数</small><strong id="total">0</strong></div><div class="stat"><small>総当たり回数</small><strong id="wins">0</strong></div><div class="stat"><small>現在の連続ハズレ</small><strong id="streak">0</strong></div><div class="stat"><small>最大連続ハズレ</small><strong id="maxStreak">0</strong></div></div>
<div class="reset-wrap"><button class="reset" id="reset">記録をリセット</button></div></section><p class="note" id="note"></p></main>
<script>
const $=id=>document.getElementById(id),MAX=10000;let stats=JSON.parse(localStorage.getItem('lotteryStats')||'{}');stats={total:+stats.total||0,wins:+stats.wins||0,streak:+stats.streak||0,maxStreak:+stats.maxStreak||0};const settings=JSON.parse(localStorage.getItem('lotterySettings')||'{}');if(+settings.denominator>=1)$('denominator').value=settings.denominator;if(+settings.count>=1)$('count').value=settings.count;
function denominator(){let n=parseFloat($('denominator').value);if(!Number.isFinite(n))n=99.9;n=Math.max(1,Math.min(1e9,n));$('denominator').value=n;return n}function count(){let n=parseInt($('count').value,10);if(!Number.isFinite(n))n=1;n=Math.max(1,Math.min(MAX,n));$('count').value=n;return n}function pct(n){const p=100/n;return p>=1?p.toFixed(3):p>=.01?p.toFixed(4):p.toPrecision(4)}function save(){localStorage.setItem('lotteryStats',JSON.stringify(stats));localStorage.setItem('lotterySettings',JSON.stringify({denominator:denominator(),count:count()}))}function display(){const n=denominator(),p=pct(n);$('title').textContent=`1 / ${n}`;$('percent').textContent=`当選確率 約${p}%`;$('note').textContent=`現在の設定は1/${n}。何回外れても次の1回の当選確率は常に約${p}%です。`}function renderStats(){for(const k of ['total','wins','streak','maxStreak'])$(k).textContent=stats[k].toLocaleString('ja-JP')}
function draw(){const n=denominator(),c=count(),prob=1/n;save();display();$('draw').disabled=true;$('draw').textContent='抽選中…';$('icon').textContent='···';$('message').textContent=`${c.toLocaleString('ja-JP')}回抽選中`;$('detail').textContent=`設定確率 1/${n}`;setTimeout(()=>{let results=[],bw=0;for(let i=0;i<c;i++){const win=Math.random()<prob;results.push(win);stats.total++;if(win){bw++;stats.wins++;stats.streak=0}else{stats.streak++;stats.maxStreak=Math.max(stats.maxStreak,stats.streak)}}$('batchTotal').textContent=c.toLocaleString('ja-JP');$('batchWins').textContent=bw.toLocaleString('ja-JP');$('batchLosses').textContent=(c-bw).toLocaleString('ja-JP');$('summary').classList.add('show');const frag=document.createDocumentFragment();results.forEach(win=>{const d=document.createElement('div');d.className='cell'+(win?' win':'');d.textContent=win?'○':'×';frag.appendChild(d)});$('grid').replaceChildren(frag);$('panel').classList.add('show');$('result').className='result '+(bw?'pulse':'shake');$('icon').textContent=bw?'🎉':'×';$('message').textContent=bw?`${bw}回当たり！`:'今回は当たりなし';$('detail').textContent=bw?`1/${n}で${c.toLocaleString('ja-JP')}回中、${bw}回当選`:`1/${n}で${c.toLocaleString('ja-JP')}回すべてハズレ`;if(bw){$('flash').classList.remove('show');void $('flash').offsetWidth;$('flash').classList.add('show')}renderStats();save();$('draw').disabled=false;$('draw').textContent='もう一度抽選'},450)}
$('draw').addEventListener('click',draw);$('denominator').addEventListener('input',display);$('denominator').addEventListener('change',save);$('count').addEventListener('change',save);document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{$('count').value=b.dataset.count;save()}));['denominator','count'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')draw()}));$('reset').addEventListener('click',()=>{if(!confirm('抽選記録をすべてリセットしますか？'))return;stats={total:0,wins:0,streak:0,maxStreak:0};save();renderStats();$('summary').classList.remove('show');$('panel').classList.remove('show');$('grid').replaceChildren();$('icon').textContent='🎯';$('message').textContent='確率と抽選回数を決めよう';$('detail').textContent='設定した確率で毎回独立して抽選します';$('draw').textContent='まとめて抽選'});renderStats();display();
</script></body></html>
